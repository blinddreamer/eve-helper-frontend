# MegaLinter: https://megalinter.io/latest/config-file/
# Code quality only: security scanning is handled by Trivy in the Docker build.
# No stylelint: its default rules are style preferences (rgb vs rgba, id casing), not bugs.
APPLY_FIXES: none
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - DOCKERFILE_HADOLINT
  - COPYPASTE_JSCPD
  - YAML_YAMLLINT
  - MARKDOWN_MARKDOWNLINT
  - JSON_JSONLINT
# 4 small clones exist today (~0.8%); fail only if duplication grows past 1%.
COPYPASTE_JSCPD_ARGUMENTS: --threshold 1
# Fail on warnings and errors, not hadolint's info-level hints.
DOCKERFILE_HADOLINT_ARGUMENTS: --failure-threshold warning
