name: Lint, then build, scan and push Docker image

on:
  push:
  pull_request:

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # JavaScript flavor: much smaller image than the full MegaLinter, and has every linter in .mega-linter.yml.
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@v10
        env:
          VALIDATE_ALL_CODEBASE: true

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22  # same as the Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  push_to_registry:
    name: Build (and push from main)
    needs: [megalinter, eslint]
    uses: blinddreamer/workflows/.github/workflows/docker.yml@main
    with:
      image: blinddreamer/eve-helper-frontend:latest
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
