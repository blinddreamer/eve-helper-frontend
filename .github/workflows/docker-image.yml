name: Build, scan and push Docker image

on:
  push:
  pull_request:

jobs:
  push_to_registry:
    name: Build (and push from main)
    uses: blinddreamer/workflows/.github/workflows/docker.yml@main
    with:
      image: blinddreamer/eve-helper-frontend:latest
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
